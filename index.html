<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1220" />
  <meta name="description" content="Nischal Adhikari — Dreaming for a Better Nepal. A Voice for the Voiceless." />
  <title>Nischal Adhikari — A Voice for the Voiceless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08111e;
      --panel: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.12);
      --text: #f5f7fb;
      --muted: #aab5c6;
      --red: #e33d4f;
      --red-light: #ff6672;
      --blue: #91b9ff;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "DM Sans", sans-serif; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -2;
      background:
        radial-gradient(ellipse at 75% 14%, rgba(57,102,169,.2), transparent 35%),
        radial-gradient(ellipse at 12% 48%, rgba(227,61,79,.09), transparent 32%),
        linear-gradient(145deg, #08111e, #0a1423 55%, #080e18);
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .container { width: min(var(--max), calc(100% - 44px)); margin: auto; }
    .topbar {
      position: fixed; z-index: 20; top: 0; left: 0; width: 100%;
      background: rgba(8,17,30,.72); backdrop-filter: blur(18px);
      border-bottom: 1px solid transparent; transition: .3s ease;
    }
    .topbar.scrolled { border-bottom-color: var(--line); background: rgba(8,17,30,.92); }
    nav { height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: Manrope, sans-serif; font-weight: 800; letter-spacing: -.04em; }
    .brand-mark { width: 38px; height: 38px; display: block; flex: 0 0 38px; overflow: hidden; border-radius: 50%; background: var(--red); box-shadow: 0 7px 24px rgba(227,61,79,.25); }\n    .brand-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 28%; filter: grayscale(100%); }
    .brand span:last-child { font-size: 15px; letter-spacing: .01em; }
    .nav-links { display: flex; align-items: center; gap: 28px; color: #c4ccda; font-size: 13px; }
    .nav-links a { transition: color .25s ease; }
    .nav-links a:hover { color: white; }
    .nav-cta { border: 1px solid rgba(255,255,255,.2); padding: 11px 16px; border-radius: 999px; color: white !important; }
    .menu-btn { display: none; border: 1px solid var(--line); background: transparent; color: white; padding: 10px 12px; border-radius: 10px; font-size: 20px; }
    .hero { min-height: 100vh; display: flex; align-items: center; padding: 145px 0 82px; position: relative; isolation: isolate; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 56px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: .19em; font-size: 11px; font-weight: 700; color: #f28c96; }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--red); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-family: Manrope, sans-serif; font-size: clamp(46px, 6.5vw, 82px); line-height: .99; letter-spacing: -.065em; margin: 23px 0 22px; max-width: 700px; }
    h1 .accent { color: var(--red-light); display: block; }
    .hero-copy { max-width: 560px; color: var(--muted); font-size: clamp(15px, 1.45vw, 18px); line-height: 1.85; }
    .hero-actions { display: flex; gap: 13px; align-items: center; flex-wrap: wrap; margin-top: 31px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 10px; border-radius: 999px; padding: 15px 21px; font-weight: 700; font-size: 13px; transition: transform .25s ease, box-shadow .25s ease, background .25s ease; }
    .btn:hover { transform: translateY(-3px); }
    .btn-primary { background: var(--red); color: white; box-shadow: 0 10px 28px rgba(227,61,79,.22); }
    .btn-primary:hover { background: #f04b5d; box-shadow: 0 15px 34px rgba(227,61,79,.3); }
    .btn-ghost { border: 1px solid var(--line); color: #e8edf5; }
    .btn-ghost:hover { background: rgba(255,255,255,.06); }
    .hero-note { display: flex; align-items: center; gap: 13px; margin-top: 42px; color: #9da9bb; font-size: 12px; }
    .note-line { width: 35px; height: 1px; background: #566277; }
    .visual { position: relative; min-height: 540px; display: grid; place-items: center; }
    .orbit { position: absolute; width: min(39vw, 450px); aspect-ratio: 1; border: 1px solid rgba(174,195,227,.15); border-radius: 50%; animation: rotate 34s linear infinite; }
    .orbit::before, .orbit::after { content: ""; position: absolute; border-radius: 50%; }
    .orbit::before { inset: 26px; border: 1px dashed rgba(174,195,227,.18); }
    .orbit::after { width: 9px; height: 9px; background: var(--red-light); top: 11%; left: 17%; box-shadow: 0 0 22px rgba(255,102,114,.8); }
    .portrait-card {
      position: relative; width: min(100%, 410px); aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.18); background:
      linear-gradient(180deg, rgba(7,15,26,.03) 20%, rgba(7,15,26,.9) 100%),
      radial-gradient(ellipse at 52% 24%, rgba(115,154,205,.55), transparent 34%),
      linear-gradient(145deg, #233b57, #142235 55%, #101824);
      box-shadow: 0 35px 90px rgba(0,0,0,.4); transform: rotate(2deg); animation: float 6s ease-in-out infinite;
    }
    .portrait-card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 15%, rgba(255,255,255,.08) 36%, transparent 54%);
      transform: translateX(-100%); animation: shine 7s ease-in-out infinite;
    }
    .mountains { position: absolute; bottom: 0; left: 0; width: 100%; height: 48%; opacity: .7; }
    .mountains svg { width: 100%; height: 100%; }
    .portrait-placeholder {
      position: absolute; top: 13%; left: 50%; transform: translateX(-50%);
      width: 42%; height: 44%; display: flex; flex-direction: column; align-items: center;
    }
    .head { width: 84px; height: 99px; background: linear-gradient(110deg,#c88d70,#efc2a1); border-radius: 46% 46% 42% 42%; position: relative; z-index: 2; box-shadow: inset -12px -5px 0 rgba(87,48,42,.12); }
    .hair { position: absolute; top: -8px; width: 90px; height: 42px; border-radius: 55% 55% 25% 20%; background: #171a20; z-index: 3; }
    .body-shape { width: 190px; height: 185px; margin-top: -1px; background: linear-gradient(120deg,#192536,#0b111b); border-radius: 45% 45% 10% 10%; position: relative; z-index: 1; border-top: 9px solid #e7eaf0; }
    .body-shape::after { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 42px; height: 65px; background: var(--red); clip-path: polygon(0 0,100% 0,72% 100%,50% 84%,28% 100%); }
    .card-caption { position: absolute; z-index: 4; bottom: 25px; left: 25px; right: 25px; }
    .caption-label { font-size: 10px; letter-spacing: .2em; color: #ff9ca5; font-weight: 700; }
    .card-caption h2 { font: 800 27px Manrope,sans-serif; letter-spacing: -.04em; margin: 8px 0; }
    .card-caption p { margin: 0; color: #bdc7d5; font-size: 12px; }
    .floating-tag { position: absolute; z-index: 5; padding: 13px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 15px; background: rgba(12,22,37,.84); backdrop-filter: blur(14px); box-shadow: 0 18px 38px rgba(0,0,0,.25); animation: float 5s ease-in-out infinite; }
    .tag-top { top: 13%; right: -4%; }
    .tag-bottom { bottom: 12%; left: -8%; animation-delay: -2s; }
    .tag-small { display: block; color: #9ba9bc; font-size: 10px; margin-bottom: 5px; }
    .tag-large { font: 700 13px Manrope,sans-serif; }
    .tag-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5ed9a6; margin-right: 6px; }
    section { padding: 110px 0; }
    .section-head { max-width: 690px; margin-bottom: 48px; }
    .section-head h2 { font: 800 clamp(32px,4.2vw,52px)/1.08 Manrope,sans-serif; letter-spacing: -.055em; margin: 18px 0; }
    .section-head p { color: var(--muted); line-height: 1.8; max-width: 580px; }
    .values { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .value-card { padding: 29px; min-height: 245px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018)); transition: transform .35s ease,border-color .35s ease,background .35s ease; }
    .value-card:hover { transform: translateY(-7px); border-color: rgba(255,102,114,.45); background: linear-gradient(145deg,rgba(227,61,79,.1),rgba(255,255,255,.025)); }
    .value-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; color: #ff9ca5; background: rgba(227,61,79,.13); margin-bottom: 25px; }
    .value-icon svg { width: 23px; height: 23px; }
    .value-card h3 { font: 700 18px Manrope,sans-serif; margin-bottom: 11px; }
    .value-card p { color: var(--muted); font-size: 14px; line-height: 1.75; margin: 0; }
    .vision-wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 70px; align-items: start; }
    .vision-statement { position: sticky; top: 125px; padding: 35px; border-radius: 22px; background: linear-gradient(150deg,rgba(227,61,79,.15),rgba(255,255,255,.025)); border: 1px solid rgba(227,61,79,.23); }
    .quote-mark { color: var(--red-light); font: 800 70px/1 Manrope,sans-serif; height: 53px; }
    .vision-statement h3 { font: 800 29px/1.25 Manrope,sans-serif; letter-spacing: -.04em; }
    .vision-statement p { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 0; }
    .vision-list { display: grid; gap: 0; }
    .vision-item { padding: 24px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 48px 1fr; gap: 18px; }
    .vision-number { color: #f28c96; font: 700 12px Manrope,sans-serif; padding-top: 4px; }
    .vision-item h3 { font: 700 18px Manrope,sans-serif; margin-bottom: 8px; }
    .vision-item p { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0; }
    .action-panel { position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--line); padding: clamp(32px,6vw,72px); background: linear-gradient(115deg,rgba(26,43,66,.95),rgba(13,24,40,.96)); }
    .action-panel::after { content: ""; position: absolute; width: 340px; height: 340px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; right: -80px; top: -150px; box-shadow: 0 0 0 35px rgba(255,255,255,.018),0 0 0 70px rgba(255,255,255,.014); }
    .action-panel h2 { font: 800 clamp(32px,4.8vw,56px)/1.05 Manrope,sans-serif; letter-spacing: -.055em; max-width: 680px; position: relative; z-index: 1; }
    .action-panel p { max-width: 600px; color: var(--muted); line-height: 1.8; position: relative; z-index: 1; }
    .action-panel .btn { position: relative; z-index: 1; margin-top: 12px; }
    .contact-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 65px; }
    .contact-copy h2 { font: 800 clamp(34px,4vw,50px)/1.1 Manrope,sans-serif; letter-spacing: -.05em; }
    .contact-copy p { color: var(--muted); line-height: 1.8; }
    .contact-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .contact-links a { border: 1px solid var(--line); border-radius: 999px; padding: 11px 15px; font-size: 12px; color: #dbe2ec; transition: .25s; }
    .contact-links a:hover { border-color: var(--red); color: white; }
    form { display: grid; gap: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    input, textarea { width: 100%; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: white; border-radius: 12px; padding: 15px 16px; font: 14px "DM Sans",sans-serif; outline: none; transition: border-color .25s,background .25s; }
    input:focus, textarea:focus { border-color: rgba(255,102,114,.7); background: rgba(255,255,255,.055); }
    input::placeholder, textarea::placeholder { color: #7f8ba0; }
    textarea { min-height: 145px; resize: vertical; }
    .form-note { font-size: 11px; color: #8793a7; line-height: 1.6; }
    footer { border-top: 1px solid var(--line); padding: 25px 0; color: #8793a7; font-size: 12px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    .footer-slogan { color: #dce3ee; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .delay-1 { transition-delay: .12s; } .delay-2 { transition-delay: .22s; } .delay-3 { transition-delay: .32s; }
    .progress { position: fixed; z-index: 30; top: 0; left: 0; width: 0%; height: 2px; background: var(--red); }
    .back-top { position: fixed; right: 22px; bottom: 22px; z-index: 15; width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: rgba(12,22,37,.8); color: white; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .25s; }
    .back-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes shine { 0%,55% { transform: translateX(-100%); } 78%,100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr .8fr; gap: 22px; }
      .visual { min-height: 460px; }
      .portrait-card { width: 330px; }
      .orbit { width: 350px; }
      .tag-top { right: -2%; } .tag-bottom { left: -2%; }
      .nav-links { gap: 17px; }
      .vision-wrap { gap: 35px; }
    }
    @media (max-width: 700px) {
      .container { width: min(100% - 34px, var(--max)); }
      nav { height: 68px; }
      .menu-btn { display: block; }
      .nav-links { display: none; position: absolute; top: 68px; left: 0; right: 0; padding: 20px 24px 24px; background: rgba(8,17,30,.98); border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; gap: 20px; }
      .nav-links.open { display: flex; }
      .nav-cta { text-align: center; }
      .hero { padding: 120px 0 60px; min-height: auto; }
      .hero-grid { grid-template-columns: 1fr; gap: 20px; }
      h1 { font-size: clamp(46px, 13vw, 68px); }
      .hero-copy { font-size: 15px; }
      .visual { min-height: 480px; margin-top: 8px; }
      .portrait-card { width: min(78%, 350px); }
      .orbit { width: min(88vw, 390px); }
      .tag-top { right: 0; top: 9%; } .tag-bottom { left: 0; bottom: 8%; }
      section { padding: 76px 0; }
      .values { grid-template-columns: 1fr; }
      .value-card { min-height: 0; }
      .vision-wrap, .contact-grid { grid-template-columns: 1fr; gap: 32px; }
      .vision-statement { position: static; }
      .field-row { grid-template-columns: 1fr; }
      .action-panel { border-radius: 22px; }
    }
  </style>
</head>
